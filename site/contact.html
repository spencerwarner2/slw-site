<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLW, Contact</title>
<link rel="stylesheet" href="../styles.css?v=mu4xyz83">
<link rel="stylesheet" href="site.css?v=mu4xyz83">
</head>
<body data-page="contact">
<div class="scroll-bar"></div>

<section class="section page-hero" data-animate>
  <div class="glow-hero"></div>
  <div class="wrap split">
    <div class="copy">
      <p class="kicker rise">Contact</p>
      <h1 class="head rise">Fuel your<br><em>growth</em>.</h1>
      <p class="lead rise">If you’re a founder or investor looking for flexible, non-dilutive capital to scale your company, we’d love to hear from you. Share a few quick details, we’ll take it from there.</p>
      <div class="tag-row rise"><span class="tag">Alternatives to equity</span><span class="tag">Thinking about M&amp;A</span><span class="tag">Navigating valuation</span></div>
    </div>
    <div class="figwrap rise">
      <form class="form" onsubmit="return false" aria-label="Contact form">
        <div class="field"><label>First name</label><input type="text" autocomplete="given-name"></div>
        <div class="field"><label>Last name</label><input type="text" autocomplete="family-name"></div>
        <div class="field full"><label>Work email</label><input type="email" autocomplete="email"></div>
        <div class="field"><label>Company</label><input type="text"></div>
        <div class="field"><label>Stage</label><select><option>Series A</option><option>Series B</option><option>Series C</option><option>Series D</option><option>Series E</option><option>Pre-IPO</option></select></div>
        <div class="field"><label>Revenue</label><select><option>$0–$5M</option><option>$5–$15M</option><option>$15–$30M</option><option>$30–$50M</option><option>$50–$100M</option><option>$100M+</option></select></div>
        <div class="field"><label>Sector</label><select><option>AI</option><option>Enterprise Software &amp; Infra</option><option>FinTech</option><option>Consumer &amp; Media</option><option>DeepTech</option><option>Healthcare</option><option>Other</option></select></div>
        <div class="field full"><label>How can we help?</label><textarea rows="3"></textarea></div>
        <div class="full"><button class="btn" type="submit">Send</button></div>
      </form>
    </div>
  </div>
</section>

<script src="site.js?v=mu4xyz83"></script>
</body>
</html>
